<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Coming Soon — ForexBridge</title>
<meta content="The new ForexBridge portal is on its way. Check live exchange rates or join the launch list to be notified when we go live." name="description"/>
<link href="assets/images/favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<link href="assets/css/main.css" rel="stylesheet"/>
<link href="assets/css/extra.css" rel="stylesheet"/>
<link href="assets/css/final-review-fixes.css" rel="stylesheet"/>
<link href="assets/css/client-final-review.css" rel="stylesheet"/><link href="assets/css/client-step2-visuals.css" rel="stylesheet"/></head>
<body>
<div class="center-screen">
<div aria-hidden="true" class="center-screen__bg"></div>
<div aria-hidden="true" class="center-screen__grid"></div>
<div class="center-screen__card">
<div style="display:flex;align-items:center;justify-content:center;gap:var(--space-2);margin-bottom:var(--space-8);">
<button aria-label="Switch to dark mode" class="icon-btn" data-theme-toggle="" type="button">
<i aria-hidden="true" class="fas fa-moon"></i>
</button>
<button aria-label="Toggle RTL layout" aria-pressed="false" class="icon-btn" data-rtl-toggle="" type="button">
<span class="toggle-label">RTL</span>
</button>
<a aria-label="Back to home" class="icon-btn" href="index.html">
<i aria-hidden="true" class="fas fa-home"></i>
</a>
</div>
<a class="header-logo" href="index.html" style="justify-content:center;color:var(--c-white);margin-bottom:var(--space-8);text-decoration:none;">
<span aria-hidden="true" class="logo-mark"><i class="fas fa-arrow-right-arrow-left"></i></span>
<span class="header-logo__text">Forex<span class="text-accent">Bridge</span></span>
</a>
<h1 class="heading-2" style="color:var(--c-white);margin-bottom:var(--space-4);">Something new is loading</h1>
<p style="font-size:var(--text-base);color:var(--c-ink-100);line-height:var(--leading-relaxed);margin-bottom:var(--space-2);">The revamped ForexBridge portal is on its way — in the meantime check live rates or join the launch list.</p>
<div aria-label="Countdown to launch" class="countdown">
<div class="countdown__item">
<div class="countdown__value" id="cdDays">00</div>
<div class="countdown__label">Days</div>
</div>
<div class="countdown__item">
<div class="countdown__value" id="cdHours">00</div>
<div class="countdown__label">Hours</div>
</div>
<div class="countdown__item">
<div class="countdown__value" id="cdMins">00</div>
<div class="countdown__label">Minutes</div>
</div>
<div class="countdown__item">
<div class="countdown__value" id="cdSecs">00</div>
<div class="countdown__label">Seconds</div>
</div>
</div>
<form class="newsletter-form m-auto" id="notifyForm" style="margin-bottom:var(--space-6);">
<input aria-label="Email address" class="newsletter-field" placeholder="you@example.com" required="" type="email"/>
<button class="btn btn-primary" type="submit">Notify Me</button>
</form>
<a class="btn btn-secondary" href="rates.html" style="font-size:var(--text-sm);">See current rates</a>
</div>
</div>
<script src="assets/js/main.js"></script>
<script>
    (function () {
      var target = new Date("2026-12-01T00:00:00+05:30").getTime();
      var elDays = document.getElementById("cdDays");
      var elHours = document.getElementById("cdHours");
      var elMins = document.getElementById("cdMins");
      var elSecs = document.getElementById("cdSecs");

      function pad(n) { return n < 10 ? "0" + n : String(n); }

      function tick() {
        var diff = Math.max(0, target - Date.now());
        var d = Math.floor(diff / 86400000);
        var h = Math.floor((diff % 86400000) / 3600000);
        var m = Math.floor((diff % 3600000) / 60000);
        var s = Math.floor((diff % 60000) / 1000);
        elDays.textContent = pad(d);
        elHours.textContent = pad(h);
        elMins.textContent = pad(m);
        elSecs.textContent = pad(s);
      }

      tick();
      setInterval(tick, 1000);

      var form = document.getElementById("notifyForm");
      if (form) {
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          if (typeof ForexApp !== "undefined") {
            ForexApp.showToast("You're on the list (demo)");
          }
        });
      }
    })();
  </script>
</body>
</html>
