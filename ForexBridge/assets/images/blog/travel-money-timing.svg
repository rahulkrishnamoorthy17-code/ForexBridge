<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <linearGradient id="b2_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081E2B"/>
      <stop offset="50%" stop-color="#0B2A36"/>
      <stop offset="100%" stop-color="#071923"/>
    </linearGradient>
    <linearGradient id="b2_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="b2_jade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="b2_glow" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="560" fill="url(#b2_bg)"/>
  <circle cx="300" cy="240" r="260" fill="url(#b2_glow)"/>
  <!-- Calendar Grid Graphic -->
  <g transform="translate(100, 100)">
    <rect width="360" height="340" rx="20" fill="#0F2432" stroke="#1D4A5E" stroke-width="1.5"/>
    <rect width="360" height="70" rx="20" fill="url(#b2_jade)"/>
    <rect y="50" width="360" height="20" fill="url(#b2_jade)"/>
    <text x="30" y="44" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Forex Timing Matrix</text>
    <circle cx="320" cy="35" r="14" fill="#047857"/>
    <text x="320" y="40" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">✓</text>
    <!-- Days header -->
    <g font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#8FB5CC" text-anchor="middle">
      <text x="45" y="105">MON</text><text x="100" y="105">TUE</text><text x="155" y="105">WED</text><text x="210" y="105">THU</text><text x="265" y="105">FRI</text><text x="315" y="105">SAT</text>
    </g>
    <!-- Day boxes -->
    <rect x="25" y="125" width="40" height="40" rx="8" fill="#153648"/>
    <rect x="80" y="125" width="40" height="40" rx="8" fill="#0D9373" opacity="0.3" stroke="#10B981" stroke-width="1.5"/>
    <rect x="135" y="125" width="40" height="40" rx="8" fill="#0D9373" opacity="0.4" stroke="#10B981" stroke-width="2"/>
    <rect x="190" y="125" width="40" height="40" rx="8" fill="#153648"/>
    <rect x="245" y="125" width="40" height="40" rx="8" fill="#153648"/>
    <rect x="295" y="125" width="40" height="40" rx="8" fill="#112430"/>
    
    <text x="100" y="150" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#34D399" text-anchor="middle">02</text>
    <text x="155" y="150" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#34D399" text-anchor="middle">03</text>
    <text x="45" y="150" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#8FB5CC" text-anchor="middle">01</text>
    <text x="210" y="150" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#8FB5CC" text-anchor="middle">04</text>
    <text x="265" y="150" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#8FB5CC" text-anchor="middle">05</text>
    <text x="315" y="150" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#5A8BA8" text-anchor="middle">06</text>
    
    <rect x="25" y="185" width="310" height="120" rx="12" fill="#132B3A" stroke="#1E475A" stroke-width="1"/>
    <text x="45" y="215" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#E8EEF2">Optimal Window: Tuesday – Wednesday</text>
    <text x="45" y="240" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#8FB5CC">Interbank liquidity peaks mid-week. Spreads are tightest</text>
    <text x="45" y="258" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#8FB5CC">before weekend volatility adjustments.</text>
    <rect x="45" y="275" width="120" height="20" rx="10" fill="#065F46"/>
    <text x="105" y="289" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">BEST VALUE DAYS</text>
  </g>
  <!-- Clock / Flight Gauge -->
  <g transform="translate(530, 130)">
    <circle cx="140" cy="140" r="130" fill="#0E2330" stroke="#1E485B" stroke-width="2"/>
    <circle cx="140" cy="140" r="105" fill="none" stroke="#1A3B4D" stroke-width="12"/>
    <circle cx="140" cy="140" r="105" fill="none" stroke="#10B981" stroke-width="12" stroke-dasharray="450" stroke-dashoffset="120" stroke-linecap="round"/>
    <text x="140" y="130" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#8FB5CC" text-anchor="middle">RECOMMENDED</text>
    <text x="140" y="160" font-family="JetBrains Mono, monospace" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">48h</text>
    <text x="140" y="185" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#34D399" text-anchor="middle">Before Departure</text>
  </g>
</svg>