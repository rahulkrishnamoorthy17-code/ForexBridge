    <text x="-40" y="-14" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle">₹</text>
    <text x="10" y="-15" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Sender</text>
    <text x="-60" y="20" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" fill="#34D399">INR 5,00,000</text>
    <text x="-60" y="40" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#8FB5CC">Account Debited</text>
  </g>
  <!-- Node Overseas (Right) -->
  <g transform="translate(720, 280)">
    <rect x="-80" y="-55" width="160" height="110" rx="16" fill="#0D2533" stroke="#1D4F65" stroke-width="1.5"/>
