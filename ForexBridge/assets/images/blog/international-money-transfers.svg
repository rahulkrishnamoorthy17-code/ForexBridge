      <stop offset="0%" stop-color="#051722"/>
      <stop offset="50%" stop-color="#08222F"/>
      <stop offset="100%" stop-color="#0A2C38"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" fill="url(#b4_bg)"/>
  <!-- Global nodes network -->
  <g stroke="#164356" stroke-width="1.5" stroke-dasharray="6,6">
    <line x1="180" y1="280" x2="450" y2="160"/>
    <line x1="450" y1="160" x2="720" y2="280"/>
    <line x1="180" y1="280" x2="450" y2="400"/>
