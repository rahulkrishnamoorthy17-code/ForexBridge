    <text x="-60" y="20" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" fill="#60A5FA">$5,995.00</text>
    <text x="-60" y="40" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#8FB5CC">Direct Bank Credit</text>
