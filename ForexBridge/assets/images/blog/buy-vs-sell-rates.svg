<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <linearGradient id="b3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061822"/>
      <stop offset="60%" stop-color="#0B2330"/>
      <stop offset="100%" stop-color="#0D2A35"/>
    </linearGradient>
    <linearGradient id="b3_card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123342"/>
      <stop offset="100%" stop-color="#0A1D27"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" fill="url(#b3_bg)"/>
  <!-- Compare Layout -->
  <g transform="translate(100, 110)">
    <!-- BUY CARD -->
    <rect x="0" y="0" width="310" height="340" rx="20" fill="url(#b3_card1)" stroke="#10B981" stroke-width="2"/>
    <rect x="25" y="25" width="80" height="28" rx="14" fill="#065F46"/>
    <text x="65" y="44" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">WE BUY</text>
    <text x="25" y="90" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#8FB5CC">Foreign Cash to INR</text>
    <text x="25" y="150" font-family="JetBrains Mono, monospace" font-size="44" font-weight="800" fill="#FFFFFF">₹82.80</text>
    <text x="25" y="180" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#8FB5CC">Rate you receive when selling USD cash</text>
    <line x1="25" y1="210" x2="285" y2="210" stroke="#1E475A" stroke-width="1"/>
    <text x="25" y="245" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#E8EEF2">✓ Zero commission fee</text>
    <text x="25" y="275" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#E8EEF2">✓ Instant UPI / Bank payout</text>
    <text x="25" y="305" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#E8EEF2">✓ Spot note verification</text>
  </g>
  <!-- SPREAD BADGE CENTER -->
  <g transform="translate(415, 230)">
    <circle cx="35" cy="35" r="35" fill="#0D9373" stroke="#34D399" stroke-width="2"/>
    <text x="35" y="32" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">SPREAD</text>
    <text x="35" y="48" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">0.75%</text>
  </g>
  <g transform="translate(490, 110)">
    <!-- SELL CARD -->
    <rect x="0" y="0" width="310" height="340" rx="20" fill="url(#b3_card1)" stroke="#2B7DE9" stroke-width="2"/>
    <rect x="25" y="25" width="80" height="28" rx="14" fill="#1A365D"/>
    <text x="65" y="44" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle">WE SELL</text>
    <text x="25" y="90" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#8FB5CC">INR to Foreign Cash</text>
    <text x="25" y="150" font-family="JetBrains Mono, monospace" font-size="44" font-weight="800" fill="#FFFFFF">₹83.45</text>
    <text x="25" y="180" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#8FB5CC">Rate you pay when purchasing USD cash</text>
    <line x1="25" y1="210" x2="285" y2="210" stroke="#1E475A" stroke-width="1"/>
    <text x="25" y="245" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#E8EEF2">✓ Genuine series currency</text>
    <text x="25" y="275" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#E8EEF2">✓ Official receipt with serials</text>
    <text x="25" y="305" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#E8EEF2">✓ Doorstep delivery option</text>
  </g>
</svg>